name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build and run inside dev container
        uses: devcontainers/action@v1
        with:
          runCmd: |
            npm ci
            npm run lint
            npm test
