name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  devcontainer-ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build devcontainer and run tests
        uses: devcontainers/action@v1
        with:
          runCmd: |
            npm ci
            npm run lint
            npm test
            npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
